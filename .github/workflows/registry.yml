name: registry

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # Every entry is read and its pinned package fetched and held against it.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 tools/test_registry.py
      - run: python3 tools/registry.py build dist
      - uses: actions/upload-artifact@v4
        with:
          name: index
          path: dist

  # What was built from main is what PiGit reads: the branch `index`.
  publish:
    if: github.event_name == 'push'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: index
          path: dist
      - name: Publish the index
        working-directory: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git init --quiet --initial-branch index
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.json icons
          git commit --quiet --message "Index of ${GITHUB_SHA}"
          git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" index
